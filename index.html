<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#111111" />
        <link rel="manifest" href="manifest.webmanifest" />
        <title>
            Quiply - A curated library of original quotes, wit, wisdom, and wonderfully questionable life advice.
        </title>
        <meta name="description" content="Random quotes over beautiful imagery — pick a category and vibe." />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Quiply — Wit, wisdom & wonderfully questionable advice" />
        <meta property="og:description"
            content="A curated library of original quotes over stunning photography. Pick a category, vibe out, copy or download." />
        <meta property="og:url" content="https://codebydusk.github.io/quiply/" />
        <meta property="og:image" content="https://codebydusk.github.io/quiply/assets/logo.svg" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Quiply — Wit, wisdom & wonderfully questionable advice" />
        <meta name="twitter:description" content="A curated library of original quotes over stunning photography." />
        <meta name="twitter:image" content="https://codebydusk.github.io/quiply/assets/logo.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap"
            rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Martel+Sans:wght@200;300;400;600;700;800;900&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="assets/style.css" />
        <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
        <link rel="apple-touch-icon" href="assets/logo.svg" />
    </head>

    <body>
        <!-- Top-left Logo -->
        <header class="logo">
            <img src="assets/logo.svg" alt="Quiply Logo" />
            <span>QUIPLY</span>
        </header>

        <!-- Loading shimmer -->
        <div class="shimmer" id="shimmer">
            <div class="loader-content">
                <img src="assets/logo.svg" alt="Loading..." class="loader-logo" />
                <p class="loader-subtitle">Tiny thoughts. Big personalities. Zero repeats.</p>
            </div>
        </div>

        <!-- Background image -->
        <div class="bg-image" id="photo" role="img" aria-label="Random background"></div>

        <!-- Centered quote -->
        <main class="center-text" aria-live="polite" aria-atomic="true">
            <h1 id="quote"></h1>
        </main>

        <!-- Top-right toolbar -->
        <div class="toolbar" role="group" aria-label="Toolbar">
            <!-- Category picker -->
            <div class="category-wrapper">
                <button type="button" class="icon-btn category-btn" id="categoryBtn" aria-label="Choose category"
                    aria-haspopup="listbox" aria-expanded="false" aria-controls="dropdown">
                    <!-- Feather: layers icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </button>
                <div class="dropdown" id="dropdown" role="listbox" aria-label="Categories"></div>
            </div>

            <!-- Copy -->
            <button type="button" class="icon-btn copy-btn" id="copyBtn" aria-label="Copy quote">
                <!-- Feather: copy icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </button>

            <!-- Download / Share -->
            <button type="button" class="icon-btn download-btn" id="downloadBtn" aria-label="Download image">
                <!-- Feather: download icon (Desktop) -->
                <svg class="icon-download" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <!-- Feather: share-2 icon (Mobile) -->
                <svg class="icon-share" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>
                    <circle cx="18" cy="19" r="3"></circle>
                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
            </button>

            <!-- Refresh -->
            <button type="button" class="icon-btn refresh-btn" id="refreshBtn" aria-label="New image & quote">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
                    <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path>
                </svg>
            </button>
        </div>

        <!-- Footer -->
        <footer class="footer">
            Backgrounds by
            <a href="https://picsum.photos/" target="_blank" rel="noopener noreferrer"> Lorem Picsum </a>
            |
            Source on
            <a href="https://github.com/codebydusk/quiply" target="_blank" rel="noopener noreferrer"> GitHub </a>
            <span id="noCredit">
                | Thanks to
                <a href="https://github.com/hotheadhacker/no-as-a-service" target="_blank"
                    rel="noopener noreferrer">no-as-a-service</a>
            </span>
        </footer>

        <script src="assets/script.js" defer></script>
    </body>

</html>
